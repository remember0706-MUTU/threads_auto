name: Instagram Reels Auto Post

on:
  workflow_dispatch:

jobs:
  post-reels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts (Korean) and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum fonts-nanum-coding ffmpeg
          fc-cache -fv
          echo "=== Nanum 폰트 파일 확인 ==="
          find /usr/share/fonts -name "*anum*" -o -name "*Nanum*" 2>/dev/null | sort

      - name: Install Python dependencies
        run: |
          pip install -r requirements_reels.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Restore Instagram session
        run: |
          echo '${{ secrets.INSTAGRAM_SESSION }}' > instagram_session.json

      - name: Run Instagram Reels post
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main_instagram.py

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-screenshots
          path: ig_*.png
          if-no-files-found: ignore
